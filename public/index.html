<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeOrder — Онлайн-замовлення</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar { background-color: #6f4e37; }
    .card-title { color: #4a3525; }
    .btn-coffee { background-color: #6f4e37; color: white; }
    .btn-coffee:hover { background-color: #533927; color: white; }
    .floating-cart { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
  </style>
</head>
<body>

  <!-- Навігація -->
  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">☕ CoffeeOrder Web System</a>
      <a href="barista.html" class="btn btn-outline-light btn-sm">Панель Бариста ➔</a>
    </div>
  </nav>

  <!-- Основний контент -->
  <div class="container">
    <h2 class="mb-4 text-center">Меню кав'ярні</h2>
    
    <!-- Індикатор завантаження -->
    <div id="loader" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Завантаження меню...</p>
    </div>

    <!-- Повідомлення про помилку -->
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

    <!-- Сітка меню -->
    <div id="menu-grid" class="row row-cols-1 row-cols-md-3 g-4"></div>
  </div>

  <!-- Плаваюча кнопка кошика -->
  <button class="btn btn-coffee floating-cart rounded-circle p-3 shadow" data-bs-toggle="modal" data-bs-target="#cartModal">
    🛒 <span id="cart-count" class="badge bg-danger rounded-pill">0</span>
  </button>

  <!-- Модальне вікно кошика -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Ваше замовлення</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul id="cart-items-list" class="list-group mb-3"></ul>
          <div class="d-flex justify-content-between fw-bold mb-3">
            <span>Разом:</span>
            <span id="cart-total">0.00 грн</span>
          </div>
          <hr>
          <h6>Дані для отримання</h6>
          <form id="order-form">
			  <div class="mb-2">
				<input type="text" id="cust-name" class="form-control" placeholder="Ваше ім'я *" required
					   oninvalid="this.setCustomValidity('Як до Вас звертатись?')"
					   oninput="this.setCustomValidity('')">
			  </div>
			  <div class="mb-2">
				<input type="tel" id="cust-phone" class="form-control" placeholder="Номер телефону (+380...) *" required
					   oninvalid="this.setCustomValidity('Вкажіть номер телефону')"
					   oninput="this.setCustomValidity('')">
			  </div>
			  <div class="mb-2">
				<input type="time" id="cust-time" class="form-control" required
					   oninvalid="this.setCustomValidity('Оберіть час самовивозу')"
					   oninput="this.setCustomValidity('')">
				<small class="text-muted">Час самовивозу</small>
			  </div>
			  <div class="mb-2">
				<textarea id="cust-comment" class="form-control" placeholder="Коментар (наприклад, без цукру)" rows="2"></textarea>
			  </div>
			  <button type="submit" class="btn btn-coffee w-100 mt-2">Підтвердити замовлення</button>
			</form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
